<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyMeet – Server-Adresse</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 14px;
      color: #e8e8ef;
      background: #12121a;
      padding: 1.25rem 1.5rem;
    }
    h1 { font-size: 1rem; font-weight: 600; margin: 0 0 0.75rem; }
    p.hint { margin: 0 0 0.75rem; color: #8b8b9e; font-size: 12px; line-height: 1.4; }
    label { display: block; margin-bottom: 0.35rem; color: #b4b4c4; font-size: 12px; }
    input[type="url"] {
      width: 100%;
      padding: 0.5rem 0.65rem;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      background: #0a0a0f;
      color: #e8e8ef;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #00d4aa; }
    .row { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
    button {
      padding: 0.45rem 1rem;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: #b4b4c4;
      border: 1px solid #2a2a3a;
    }
    button.primary {
      background: linear-gradient(135deg, #00f0c0, #00d4aa);
      color: #0a0a0f;
      font-weight: 600;
    }
    .err { color: #f87171; font-size: 12px; margin-top: 0.5rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Server-Adresse</h1>
  <p class="hint">Diese URL wird gespeichert und beim nächsten Start geladen. Leer lassen und speichern = Standard-Server.</p>
  <label for="url">URL (https://…)</label>
  <input type="url" id="url" placeholder="" autocomplete="url" spellcheck="false" />
  <div class="err" id="err"></div>
  <div class="row">
    <button type="button" class="secondary" id="cancel">Abbrechen</button>
    <button type="button" class="primary" id="save">Speichern &amp; laden</button>
  </div>
  <script>
    (async function () {
      const input = document.getElementById('url');
      const err = document.getElementById('err');
      const def = await window.easymeetSettings.getDefaultUrl();
      input.placeholder = def;
      const saved = await window.easymeetSettings.getSavedUrl();
      input.value = saved || '';

      document.getElementById('cancel').onclick = () => window.easymeetSettings.close();
      document.getElementById('save').onclick = async () => {
        err.textContent = '';
        const r = await window.easymeetSettings.saveUrl(input.value.trim());
        if (r.ok) window.easymeetSettings.close();
        else err.textContent = r.error || 'Speichern fehlgeschlagen.';
      };
    })();
  </script>
</body>
</html>

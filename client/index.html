<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta
			name="theme-color"
			content="#0a0a0f" />
		<title>EasyMeet – Chat, Dateien, Bildschirm & Sprachräume</title>
	</head>
	<body>
		<div class="bg-orbs">
			<div class="bg-orb bg-orb--1"></div>
			<div class="bg-orb bg-orb--2"></div>
			<div class="bg-orb bg-orb--3"></div>
		</div>
		<div
			id="lang-switcher"
			class="lang-switcher"></div>
		<div
			id="mobile-overlay"
			class="mobile-overlay"
			hidden></div>
		<div
			id="toast-root"
			class="toast-root"
			aria-live="polite"></div>
		<div id="app"></div>
		<div id="remote-audio-container" class="remote-audio-container"></div>
		<script
			type="module"
			src="/src/main.js"></script>

# Easymeet — Docker Compose (runtime config only, no image rebuild)
#
# Variables: ./.env → container environment (env_file).
# Optional: set values under `environment:` — overrides env_file.
#
# One-time: cp .env.example .env
#
# Start: docker network create frontend && docker compose up -d

services:
    app:
        image: smotherer/easymeet:latest
        env_file:
            - path: ./.env
              required: false
        # Optional: fixed values in YAML (override same keys from env_file)
        # environment:
        #   MEDIASOUP_ANNOUNCED_IP: 203.0.113.10
        #   PORT: "3001"
        networks:
            frontend:
                ipv4_address: 172.20.0.2
        volumes:
            - /opt/docker_files/easymeet_data:/app/data

networks:
    frontend:
        external: true


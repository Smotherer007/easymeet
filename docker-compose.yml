# Easymeet – Docker Compose (Konfiguration nur zur Laufzeit, kein Image-Rebuild)
#
# Variablen: ./.env → Umgebungsvariablen im Container (env_file).
# Optional: unter `environment:` Werte setzen — überschreiben env_file.
#
# Feste Räume **ohne Volume**: in .env z. B.
#   EASYMEET_PERSISTENT_ROOMS_JSON='{"rooms":[{"id":"LOBBY"}]}'
# (eine Zeile, minified). Dann brauchst du keinen Mount.
#
# **Mit** JSON-Datei auf dem Host: unten den `volumes:`-Block einkommentieren (Bind-Mount aktivieren).
# Dazu in .env: EASYMEET_PERSISTENT_ROOMS=persistent-rooms.json
#
# Einmalig: cp .env.example .env
#
# Start: docker network create frontend && docker compose up -d

services:
    app:
        image: smotherer/easymeet:latest
        env_file:
            - path: ./.env
              required: false
        # Optional: feste Werte direkt in der YAML (überschreiben gleiche Keys aus env_file)
        # environment:
        #   MEDIASOUP_ANNOUNCED_IP: 203.0.113.10
        #   PORT: "3001"
        # Nur nötig, wenn du persistent-rooms als Datei pflegst (nicht nur EASYMEET_PERSISTENT_ROOMS_JSON):
        # volumes:
        #     - type: bind
        #       source: ./persistent-rooms.json
        #       target: /app/persistent-rooms.json
        #       read_only: true
        networks:
            - frontend

networks:
    frontend:
        external: true

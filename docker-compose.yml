# Easymeet – Production-Compose
#
# 1. Optional: cp .env.example .env und MEDIASOUP_ANNOUNCED_IP setzen.
# 2. Netzwerk: docker network create frontend
# 3. docker compose up -d
#
# Keine `ports:` – Zugriff nur intern (z. B. Nginx Proxy Manager im selben Netz → app:3001).
# RTP-UDP (RTC_*) muss von eurem Proxy/Host zu diesem Container durchgereicht werden.
#
# Fehler „port is already allocated“ trotzdem? → meist docker-compose.override.yml
# oder gemergte Compose mit ports:. Prüfen: docker compose config
# Siehe docs/docker-compose-troubleshooting.md
#
# Ohne .env gelten die Default-Werte in ${VAR:-default}.

services:
  app:
    image: smotherer/easymeet:latest
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${PORT:-3001}
      - NODE_ENV=${NODE_ENV:-production}
      - MEDIASOUP_LISTEN_IP=${MEDIASOUP_LISTEN_IP:-0.0.0.0}
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP:-}
      - RTC_MIN_PORT=${RTC_MIN_PORT:-40000}
      - RTC_MAX_PORT=${RTC_MAX_PORT:-40200}
    networks:
      - frontend
    # Eigene feste Räume (überschreibt die im Image eingebaute Standard-JSON):
    # cp config/persistent-rooms.example.json config/persistent-rooms.json
    # volumes:
    #   - ./config/persistent-rooms.json:/app/config/persistent-rooms.json:ro

networks:
  frontend:
    external: true
